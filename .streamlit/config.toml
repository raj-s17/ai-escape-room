# Shared look for Version 1 and Version 2: a dark old library (wood, brass).
# Only [theme] is set, so the app is always dark (no light/dark switch).
[theme]
base = "dark"
primaryColor = "#d9a35b"
backgroundColor = "#16110c"
secondaryBackgroundColor = "#251c13"
textColor = "#efe4d2"
font = "serif"
baseRadius = "medium"

[client]
toolbarMode = "viewer"
